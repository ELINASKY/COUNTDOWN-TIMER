<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event Countdown Timer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&family=Orbitron:wght@500;800&family=Bebas+Neue&family=Oswald:wght@400;700&family=Roboto+Mono:wght@300;700&family=Share+Tech+Mono&family=Playfair+Display:wght@500;800&family=Montserrat:wght@700;800&family=Poppins:wght@600;700&family=Roboto:wght@500;700&family=Lato:wght@700;900&family=Raleway:wght@700;800&family=Anton&family=Archivo+Black&family=Bungee&family=Audiowide&family=Russo+One&family=Rajdhani:wght@600;700&family=Teko:wght@500;700&family=Exo+2:wght@600;800&family=Press+Start+2P&family=VT323&family=Righteous&family=Monoton&family=Lobster&family=Pacifico&family=Cinzel:wght@600;800&family=Abril+Fatface&family=Staatliches&family=Black+Ops+One&display=swap">
<style>
:root{--bg:#000;--fg:#fff;--font:'Inter',sans-serif;--fs:120px;box-sizing:border-box}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{height:100%;margin:0;color:var(--fg);font-family:var(--font);overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:env(safe-area-inset-top,0) 3vw env(safe-area-inset-bottom,0)}
#title{font-weight:800;font-size:calc(clamp(28px,6vw,88px)*var(--tm,1));color:var(--tfg,var(--fg));text-align:center;max-width:94vw;outline:none;line-height:1.1;cursor:text;padding:.1em .3em;border-radius:8px}
#title:focus{box-shadow:0 0 0 2px var(--fg)}
#time{display:flex;align-items:flex-start;justify-content:center;font-size:var(--fs);line-height:1;font-variant-numeric:tabular-nums;font-weight:700;gap:.04em}
#time i{font-style:normal;opacity:.6;padding:0 .02em}
.u{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.n{display:block}
.l{display:none;font-size:.13em;letter-spacing:.2em;font-weight:600;opacity:.7;margin-top:.3em}
.edit .sel .n{box-shadow:0 .05em 0 -.0em currentColor}
#status{font-size:clamp(12px,1.6vw,20px);letter-spacing:.25em;opacity:.65;font-weight:600}
#prog{display:none;position:fixed;left:0;bottom:0;height:10px;background:var(--fg);width:0;opacity:.85}
.flash{animation:bl 1s steps(1) infinite;color:#ff3b30}
@keyframes bl{50%{opacity:.12}}
@media(prefers-reduced-motion:reduce){.flash{animation:none}}
/* templates */
.tpl-minimal #title{position:absolute;top:calc(6vh + env(safe-area-inset-top,0));font-size:calc(clamp(18px,3vw,38px)*var(--tm,1));letter-spacing:.3em;text-transform:uppercase}
.tpl-minimal #time{font-weight:300}
.tpl-boxes #time{gap:.14em;align-items:stretch}
.tpl-boxes #time i{display:none}
.tpl-boxes .u{border:3px solid var(--fg);border-radius:.14em;padding:.1em .18em .06em;min-width:1.6em}
.tpl-boxes .l{display:block}
.tpl-boxes.edit .sel{background:color-mix(in srgb,var(--fg) 16%,transparent)}
.tpl-boxes.edit .sel .n{box-shadow:none}
.tpl-stage #title{position:absolute;top:0;left:0;right:0;max-width:none;border-radius:0;background:var(--tfg,var(--fg));color:var(--bg);padding:.25em .5em;font-size:calc(clamp(26px,5.5vw,80px)*var(--tm,1))}
.tpl-stage #prog{display:block}
.tpl-stage #time{font-weight:800;margin-top:6vh}
/* more templates */
.tpl-neon #time{font-weight:600;text-shadow:0 0 .08em currentColor,0 0 .25em currentColor,0 0 .6em currentColor}
.tpl-neon #title{text-shadow:0 0 .15em currentColor,0 0 .5em currentColor}
.tpl-neon #app::before{content:"";position:absolute;inset:3vh 3vw;border:2px solid var(--fg);border-radius:20px;box-shadow:0 0 14px var(--fg),inset 0 0 14px var(--fg);opacity:.7;pointer-events:none}
.tpl-flip #time{gap:.12em;align-items:stretch}
.tpl-flip #time i{display:none}
.tpl-flip .u{position:relative;background:color-mix(in srgb,var(--fg) 14%,transparent);border-radius:.1em;padding:.06em .14em .04em;min-width:1.5em;overflow:hidden}
.tpl-flip .u::after{content:"";position:absolute;left:0;right:0;top:44%;height:.02em;min-height:2px;background:var(--bg)}
.tpl-flip .l{display:block}
.tpl-left #app{align-items:flex-start;padding-left:4vw;padding-right:4vw}
.tpl-left #title{text-align:left;padding-left:0}
.tpl-left #status,.tpl-left #logo{align-self:flex-start}
.tpl-elegant #title{letter-spacing:.25em;text-transform:uppercase;font-weight:600;border-top:1px solid currentColor;border-bottom:1px solid currentColor;border-radius:0;padding:.5em 1.4em;font-size:calc(clamp(18px,3.4vw,46px)*var(--tm,1))}
.tpl-elegant #time{font-weight:200}
.tpl-elegant #time i{opacity:.4}
.tpl-frame #app::before{content:"";position:absolute;inset:4vh 3vw;border:3px solid var(--fg);border-radius:18px;pointer-events:none}
.tpl-frame #title{position:absolute;top:4vh;transform:translateY(-55%);background:var(--bg);padding:.1em .6em}
.tpl-bar #prog{display:block;height:3.5vh;opacity:.9}
.tpl-bar #app{padding-bottom:4vh}
/* display styles */
#time.view-clock{flex-direction:column;align-items:center;gap:.4em}
.view-clock svg{display:block;max-width:92vw;overflow:visible}
.view-clock .sub{display:flex;align-items:flex-start;justify-content:center;gap:.04em}
.view-clock .u,.view-watch .u{border:0;background:none;padding:0;min-width:0}
.view-clock .u::after,.view-watch .u::after{content:none}
.view-clock .l,.view-watch .l{display:none}
#time.view-clock i,#time.view-watch i{display:inline}
#time.view-watch{display:block;position:relative}
.view-watch::before,.view-watch::after{content:"";position:absolute;right:-.1em;width:.12em;height:.45em;background:#666;border-radius:.05em}
.view-watch::before{top:.45em}
.view-watch::after{bottom:.45em}
.wbody{position:relative;padding:.2em;border-radius:.42em;background:linear-gradient(145deg,#dde1e6,#7d848c 45%,#c8ccd2);box-shadow:0 .08em .3em rgba(0,0,0,.6),inset 0 0 0 .02em rgba(255,255,255,.5)}
.wbody::before,.wbody::after{content:"";position:absolute;left:50%;width:62%;height:.8em;transform:translateX(-50%);background:linear-gradient(90deg,#1c1c1c,#444 50%,#1c1c1c);z-index:-1}
.wbody::before{bottom:calc(100% - .2em);border-radius:.2em .2em 0 0}
.wbody::after{top:calc(100% - .2em);border-radius:0 0 .2em .2em}
.wscr{background:#0c120d;border-radius:.3em;padding:.1em .3em .16em;box-shadow:inset 0 .04em .15em #000;min-width:4.4em}
.wtop{display:flex;justify-content:space-between;font-size:.2em;letter-spacing:.15em;opacity:.7;font-family:'Share Tech Mono',monospace;font-weight:400;margin-bottom:.3em}
.wrow{display:flex;justify-content:center;align-items:center;gap:calc(.1em*var(--wgap,1));transform:skewX(-6deg)}
.view-watch .n{display:flex;align-items:center}
.seg{height:.8em;width:.48em;margin:0 .03em;flex:none;filter:drop-shadow(0 0 calc(.05em*var(--glow,1)) currentColor)}
.view-watch .wrow i{font-size:0;width:calc(.12em + .1em*var(--wgap,1));height:.8em;position:relative;opacity:1;padding:0;filter:drop-shadow(0 0 calc(.05em*var(--glow,1)) currentColor)}
.view-watch .wrow i::before,.view-watch .wrow i::after{content:"";position:absolute;left:50%;width:.1em;height:.1em;margin-left:-.05em;background:currentColor;border-radius:50%}
.view-watch .wrow i::before{top:.24em}
.view-watch .wrow i::after{top:.52em}
.view-watch.run .wrow i{animation:cb 1s steps(1) infinite}
@keyframes cb{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.view-watch.run .wrow i{animation:none}}
.noslant .wrow{transform:none}
.seg path.off{opacity:.09}
.noghost .seg path.off{opacity:0}
.ws-sport .wbody{background:#1a1a1a;border:.07em solid #ff7a00;border-radius:.3em;box-shadow:0 .08em .3em rgba(0,0,0,.6),inset 0 0 0 .03em #444}
.ws-sport .wbody::before,.ws-sport .wbody::after{background:linear-gradient(90deg,#0d0d0d,#2c2c2c 50%,#0d0d0d)}
.ws-sport .wscr{background:#000}
.ws-gold .wbody{background:linear-gradient(145deg,#f7e08a,#b8860b 45%,#f3d675)}
.ws-gold .wbody::before,.ws-gold .wbody::after{background:linear-gradient(90deg,#2a1608,#5a3a1c 50%,#2a1608)}
.ws-panel .wbody{background:#000;padding:.14em;border-radius:.12em;border:.03em solid currentColor;box-shadow:0 0 calc(.3em*var(--glow,1)) currentColor,inset 0 0 calc(.3em*var(--glow,1)) color-mix(in srgb,currentColor 35%,transparent)}
.ws-score .wbody{background:linear-gradient(#2d3138,#15171b);border:.05em solid #666;border-radius:.08em;padding:.14em;box-shadow:0 .1em .4em #000}
.ws-score .wtop{font-size:.26em;opacity:.95}
.ws-score .wscr{background:#000;border:.03em solid #444}
.ws-bare .wbody{background:none;box-shadow:none;padding:0}
.ws-bare .wscr{background:none;box-shadow:none;padding:0}
.ws-bare .wtop{display:none}
.ws-panel .wbody::before,.ws-panel .wbody::after,.ws-score .wbody::before,.ws-score .wbody::after,.ws-bare .wbody::before,.ws-bare .wbody::after{display:none}
.ws-panel.view-watch::before,.ws-panel.view-watch::after,.ws-score.view-watch::before,.ws-score.view-watch::after,.ws-bare.view-watch::before,.ws-bare.view-watch::after{display:none}
.noglow .seg,.noglow .wrow i{filter:none}
.noglow.ws-panel .wbody{box-shadow:none}
.ledbg .wscr{background:var(--ledbg)}
.ledbg.ws-panel .wbody{background:var(--ledbg)}
.ledbg.ws-bare .wscr{padding:.1em .3em .16em}
/* controls */
#bar{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0));transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:92vw;opacity:.45;transition:opacity .3s}
#bar:hover,#bar:focus-within{opacity:1}
#bar.hide{opacity:0;pointer-events:none}
button{font:inherit;color:#fff;background:#222;border:1px solid #555;border-radius:8px;min-width:40px;height:40px;padding:0 12px;cursor:pointer;font-size:15px}
button:hover{background:#333}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #4da3ff;outline-offset:2px}
#dev{position:fixed;right:calc(12px + env(safe-area-inset-right,0));bottom:calc(6px + env(safe-area-inset-bottom,0));font-size:15px;opacity:.65;letter-spacing:.05em;font-weight:600;pointer-events:none}
#menubtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));z-index:5;opacity:.5}
#menubtn:hover{opacity:1}
#menu{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));display:none;flex-direction:column;gap:2px;background:#151515;border:1px solid #444;border-radius:10px;padding:6px;z-index:6}
#menu.on{display:flex}
#menu button{text-align:left;border:0;background:transparent;min-width:190px}
#menu button:hover{background:#2a2a2a}
.tpl-stage #title{padding-left:110px;padding-right:110px}
.ed{font:inherit;font-variant-numeric:tabular-nums;color:inherit;background:transparent;border:0;border-bottom:.04em solid currentColor;text-align:center;outline:none;padding:0;min-width:1.2ch}
.fs #bar,.fs #menubtn,.fs #menu,.fs #status{display:none!important}
.fs{cursor:none}
#pn input[type=checkbox]{width:18px;height:18px}
#bgi,#bgv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;display:none}
#bgd{position:fixed;inset:0;z-index:-1;pointer-events:none}
#logo{display:none;max-height:calc(var(--lh,12)*1vh);max-width:70vw;object-fit:contain}
#pn input[type=range]{accent-color:#4da3ff}
/* panels */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:9;padding:12px}
#ov.on{display:flex}
#pn{background:#151515;color:#eee;font-family:Inter,system-ui,sans-serif;width:min(560px,100%);max-height:88vh;overflow:auto;border-radius:14px;padding:20px 22px;border:1px solid #333}
#pn h2{margin:0 0 12px;font-size:20px}
#pn h3{margin:18px 0 8px;font-size:14px;font-weight:600;color:#aaa}
#pn label{display:block;font-size:13px;color:#aaa;margin:10px 0 4px}
#pn input[type=text],#pn select{width:100%;height:40px;background:#222;color:#fff;border:1px solid #555;border-radius:8px;padding:0 10px;font:inherit}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw button{width:34px;min-width:34px;height:34px;padding:0;border-radius:50%;border:2px solid #666}
.sw input[type=color]{width:44px;height:34px;border:0;background:none;padding:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #2a2a2a;font-size:14px}
.row button{height:32px;min-width:96px;font-size:13px}
kbd{background:#2a2a2a;border:1px solid #555;border-radius:5px;padding:2px 8px;font:600 13px Inter,sans-serif}
.x{float:right;height:34px}
p.t{font-size:13px;color:#aaa;line-height:1.5}
</style>
</head>
<body>
<img id="bgi" alt=""><video id="bgv" muted loop autoplay playsinline></video><div id="bgd"></div>
<div id="app">
  <img id="logo" alt="Logo">
  <div id="title" contenteditable="true" spellcheck="false" aria-label="Event title"></div>
  <div id="time"></div>
  <div id="status"></div>
</div>
<div id="prog"></div>
<div id="bar">
  <button onclick="act('left')" title="Previous unit" aria-label="Previous unit">◀</button>
  <button onclick="act('up')" title="Increase" aria-label="Increase">▲</button>
  <button onclick="act('down')" title="Decrease" aria-label="Decrease">▼</button>
  <button onclick="act('right')" title="Next unit" aria-label="Next unit">▶</button>
  <button id="bgo" onclick="act('toggle')" style="min-width:84px">Start</button>
  <button onclick="act('reset')">Reset</button>
</div>
<button id="menubtn" onclick="tgMenu(!$('menu').classList.contains('on'))" aria-label="Menu">☰ Menu</button>
<div id="menu">
  <button onclick="act('full')">Full screen</button>
  <button onclick="act('settings');tgMenu(false)">Settings</button>
  <button onclick="act('help');tgMenu(false)">Help and keys</button>
  <button id="bmode" onclick="act('mode');tgMenu(false)">Direction</button>
  <button id="bview" onclick="act('view');tgMenu(false)">Display style</button>
</div>
<div id="dev"></div>
<div id="ov"><div id="pn" role="dialog"></div></div>

<script>
const ACTS=[['up','Increase selected value','ArrowUp'],['down','Decrease selected value','ArrowDown'],['left','Select previous unit','ArrowLeft'],['right','Select next unit','ArrowRight'],['toggle','Start / pause','Space'],['reset','Reset to 10 minutes','Delete'],['mode','Switch count down / count up','KeyM'],['full','Full screen on / off','KeyF'],['help','Open help','KeyH'],['settings','Open settings','KeyS'],['view','Switch timer / clock / watch','KeyV']];
const FONTS=[['Inter','sans-serif'],['Orbitron','sans-serif'],['Bebas Neue','sans-serif'],['Oswald','sans-serif'],['Roboto Mono','monospace'],['Share Tech Mono','monospace'],['Playfair Display','serif'],['Montserrat','sans-serif'],['Poppins','sans-serif'],['Roboto','sans-serif'],['Lato','sans-serif'],['Raleway','sans-serif'],['Anton','sans-serif'],['Archivo Black','sans-serif'],['Bungee','sans-serif'],['Audiowide','sans-serif'],['Russo One','sans-serif'],['Rajdhani','sans-serif'],['Teko','sans-serif'],['Exo 2','sans-serif'],['Press Start 2P','monospace'],['VT323','monospace'],['Righteous','sans-serif'],['Monoton','sans-serif'],['Lobster','cursive'],['Pacifico','cursive'],['Cinzel','serif'],['Abril Fatface','serif'],['Staatliches','sans-serif'],['Black Ops One','sans-serif'],['Arial','sans-serif'],['Georgia','serif'],['Courier New','monospace'],['Impact','sans-serif'],['Verdana','sans-serif']];
const TPLS=[['classic','Classic'],['minimal','Minimal'],['boxes','Digital boxes'],['stage','Stage banner'],['neon','Neon glow'],['flip','Flip cards'],['left','Left aligned'],['elegant','Elegant'],['frame','Framed'],['bar','Progress bar']];
const BGS=['#000000','#0b1e3f','#5a0a14','#0d3b24','#3a1458','#ffffff'];
const LEDBGS=['#000000','#0c120d','#1a0000','#001a33','#2a2a2a','#ffffff'];
const FGS=['#ffffff','#ffd60a','#30d158','#64d2ff','#ff453a','#000000'];
const DEV='DigiCre8 Studios';
const DEF={title:'Event Title',units:{h:true,m:true,s:true},bg:'#000000',size:100,shadow:'none',shadowC:'#000000',stroke:0,strokeC:'#000000',tfont:'',tfg:'',tsize:100,tbold:true,tshadow:'none',tshadowC:'#000000',tstroke:0,tstrokeC:'#000000',logoOn:false,logo:'',logoH:12,bgType:'color',bgImg:'',dim:30,local:[],view:'digits',wstyle:'panel',wslant:true,wghost:true,cstyle:'classic',glow:50,wgap:100,ledbg:'',fg:'#ffffff',font:'Inter',tpl:'classic',mode:'down',total:600,keys:{}};
ACTS.forEach(a=>DEF.keys[a[0]]=a[2]);
let S=JSON.parse(JSON.stringify(DEF));
try{const d=JSON.parse(localStorage.getItem('evtimer')||'null');if(d){S={...S,...d,keys:{...S.keys,...(d.keys||{})}}}}catch(e){}
S.bgImg='';S.bgType='color';
const save=()=>{const{bgImg,bgType,...r}=S;try{localStorage.setItem('evtimer',JSON.stringify(r))}catch(e){try{const{logo,...q}=r;localStorage.setItem('evtimer',JSON.stringify(q))}catch(x){}}};
let run=false,el=0,t0=0,sel=1,done=false,listen=null,panel=null,fsOn=false;
const visUnits=()=>{const u=[0,1,2].filter(i=>S.units['hms'[i]]);return u.length?u:[2]};
function split(sec){const vis=visUnits();let rem=sec;const o=[];[3600,60,1].forEach((d,i)=>{if(!vis.includes(i))return;const q=Math.floor(rem/d);rem-=q*d;o.push([i,q])});return o}
const curSec=()=>S.mode==='down'?Math.max(0,Math.ceil((S.total*1000-el)/1000)):S.total+Math.floor(el/1000);
function setU(k,v){S.units[k]=v;if(!['h','m','s'].some(x=>S.units[x]))S.units[k]=true;save();render();openPanel('set',true)}
function tgMenu(b){$('menu').classList.toggle('on',b)}
function enterFS(){fsOn=true;tgMenu(false);try{const e=document.documentElement,r=(e.requestFullscreen||e.webkitRequestFullscreen||(()=>{})).call(e);if(r&&r.catch)r.catch(()=>{})}catch(x){}render()}
function exitFS(){fsOn=false;try{const d=document;if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d)}catch(x){}render()}
const $=id=>document.getElementById(id);
const kn=c=>({ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Space:'Space'}[c]||c.replace(/^Key|^Digit/,''));

let vidURL='';
const fam=n=>{const f=FONTS.find(x=>x[0]===n);return `'${String(n).replace(/'/g,'')}',${f?f[1]:'sans-serif'}`};
const cwOf=n=>({'Orbitron':.82,'Audiowide':.8,'Press Start 2P':1,'Monoton':.8,'Bungee':.78,'Russo One':.7,'Black Ops One':.75,'Archivo Black':.72,'Bebas Neue':.5,'Oswald':.5,'Anton':.5,'Teko':.48,'Staatliches':.5,'Rajdhani':.52,'VT323':.45}[n]||.62);
const shCss=(k,c)=>k==='soft'?`0 .05em .12em ${c}`:k==='glow'?`0 0 .2em ${c},0 0 .5em ${c}`:k==='hard'?`.06em .06em 0 ${c}`:'none';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fopts=(cur,same)=>(same?`<option value="" ${!cur?'selected':''}>Same as timer</option>`:'')+`<optgroup label="Built-in">`+FONTS.map(f=>`<option ${cur===f[0]?'selected':''}>${f[0]}</option>`).join('')+`</optgroup>`+(S.local.length?`<optgroup label="Installed on this computer">`+S.local.map(n=>`<option ${cur===n?'selected':''}>${esc(n)}</option>`).join('')+`</optgroup>`:'');
const rng=(k,mn,mx,lab,u)=>`<label>${lab}: <b>${S[k]}${u}</b></label><input type="range" min="${mn}" max="${mx}" value="${S[k]}" oninput="S['${k}']=+this.value;save();apply();this.previousElementSibling.querySelector('b').textContent=this.value+'${u}'" style="width:100%">`;
const shSel=k=>`<select onchange="set('${k}',this.value)">${['none','soft','glow','hard'].map(o=>`<option ${S[k]===o?'selected':''}>${o}</option>`).join('')}</select>`;
const col=(k,lab)=>`<label>${lab}</label><input type="color" value="${S[k]||'#ffffff'}" oninput="set('${k}',this.value)" style="width:60px;height:34px;border:0;background:none;padding:0">`;
function applyFx(){
  const st=(e,sh,shc,sw,sc)=>{e.style.textShadow=sh==='none'?'':shCss(sh,shc);e.style.webkitTextStroke=sw>0?sw+'px '+sc:'';e.style.paintOrder='stroke fill'};
  st($('time'),S.shadow,S.shadowC,S.stroke,S.strokeC);
  st($('title'),S.tshadow,S.tshadowC,S.tstroke,S.tstrokeC);
  const r=document.documentElement.style;

    <label for="cf">Or type an installed font name</label><div class="sw"><input type="text" id="cf" placeholder="e.g. Segoe UI" style="flex:1;height:40px;background:#222;color:#fff;border:1px solid #555;border-radius:8px;padding:0 10px;font:inherit"><button style="width:auto;min-width:60px;border-radius:8px;font-size:13px;background:#222" onclick="addFont($('cf').value)">Use</button></div>
    <p class="t" id="fmsg"></p>
    
    <h3>Keyboard shortcuts</h3>
    ${ACTS.map(a=>`<div class="row"><span>${a[1]}</span><button onclick="listen='${a[0]}';openPanel('set',true)">${listen===a[0]?'Press a key…':kn(S.keys[a[0]])}</button></div>`).join('')}
    <p class="t"><button onclick="ACTS.forEach(a=>S.keys[a[0]]=a[2]);save();openPanel('set',true)">Restore default keys</button></p>`;
  }
  pn.scrollTop=keep?st:0;
}
apply();wake();
</script>
</body>
